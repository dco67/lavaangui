<style>
:root { color-scheme: light; --ink:#203044; --muted:#536477; --accent:#245b81; --rule:#d4dee7; --paper:#fff; --pale:#f1f6fa; }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0 auto; padding:2.8rem 2rem 4rem; max-width:1040px; color:var(--ink); background:var(--paper); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:16px; line-height:1.65; }
header#title-block-header { border-top:6px solid var(--accent); padding:1.35rem 0 1.1rem; border-bottom:1px solid var(--rule); margin-bottom:1.6rem; }
h1.title { font-size:clamp(1.9rem,4vw,2.75rem); line-height:1.1; margin:.25rem 0 .65rem; letter-spacing:-.035em; color:#18334a; }
.subtitle { color:var(--muted); font-size:1.05rem; margin:0; }
nav#TOC { margin:1.5rem 0 2.1rem; padding:1rem 1.4rem; background:var(--pale); border-left:4px solid var(--accent); border-radius:0 6px 6px 0; }
nav#TOC::before { content:"Contents"; font-weight:700; color:#18334a; }
nav#TOC ul { margin:.5rem 0; padding-left:1.25rem; }
nav#TOC li { margin:.16rem 0; }
h2 { margin-top:2.45rem; padding-top:1.0rem; border-top:1px solid var(--rule); color:#18334a; line-height:1.3; font-size:1.55rem; letter-spacing:-.02em; }
h3 { margin-top:1.7rem; color:#245b81; font-size:1.12rem; line-height:1.35; }
p,li { overflow-wrap:anywhere; }
a { color:#1d5a88; text-decoration-thickness:1px; text-underline-offset:2px; }
a:focus-visible { outline:3px solid #c48032; outline-offset:3px; }
code { font-family:Consolas,"SFMono-Regular",Menlo,monospace; font-size:.9em; color:#183b55; background:#f1f5f8; padding:.1em .24em; border-radius:3px; overflow-wrap:anywhere; }
pre { padding:1rem; background:#f1f5f8; border:1px solid var(--rule); border-radius:5px; overflow-x:auto; font-size:.87rem; line-height:1.55; }
pre code { background:transparent; padding:0; white-space:pre; overflow-wrap:normal; }
table { border-collapse:collapse; width:100%; margin:1.2rem 0 1.65rem; font-size:.92rem; line-height:1.42; }
th { background:#e8f0f5; color:#18334a; text-align:left; font-weight:650; }
th,td { vertical-align:top; padding:.65rem .72rem; border-bottom:1px solid var(--rule); overflow-wrap:anywhere; }
tr:nth-child(even) td { background:#fafbfd; }
hr { border:0; border-top:1px solid var(--rule); }
@media(max-width:640px){ body { padding:1.25rem .9rem 3rem; font-size:15px; } table { font-size:.82rem; } td,th { padding:.46rem .4rem; } nav#TOC {padding:.8rem;} }
@media print { body{padding:0; max-width:none; color:black;font-size:10.5pt;} h2,h3 {break-after:avoid;} tr,pre {break-inside:avoid;} a{color:inherit;} nav#TOC {break-after:page;} }
</style>
